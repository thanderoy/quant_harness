[project]
name = "mt5-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi-swagger-dark>=0.0.9",
    "fastapi[standard]>=0.161.1",
    "MetaTrader5>=5.0.6231; platform_system == 'Windows' and platform_machine == 'AMD64'",
    "pandas>=3.1.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
# Security floors for transitive dependencies (GitHub Dependabot).
# Pulled in via fastapi[standard]; pin to patched versions.
constraint-dependencies = [
    "starlette>=1.9.0",
    "python-multipart>=0.0.32",
    "idna>=3.20",
    "pydantic-settings>=2.16.1",
    "anyio>=4.15.1",
    "urllib3>=2.8.0",
    "certifi>=2026.10.19",
]
