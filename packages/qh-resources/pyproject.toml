[project]
name = "qh-resources"
version = "0.1.0"
description = "quant_harness — instrument-neutral core: registry, mask, panel, indicators, sizing, broker port"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
