[project]
name = "mt5-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi-swagger-dark>=0.0.9",
    "fastapi[standard]>=0.103.2",
    "MetaTrader5; platform_system == 'Windows' and platform_machine == 'AMD64'",
]

[tool.uv]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
# Security floors for transitive dependencies (GitHub Dependabot).
# Pulled in via fastapi[standard]; pin to patched versions.
constraint-dependencies = [
    "starlette>=1.3.1",
    "python-multipart>=0.0.31",
    "idna>=3.15",
]
