# Test tooling. uv-native dependency group (PEP 735) rather than the
# [project.optional-dependencies] extra the spec sketched — these are dev-time
# tools, not optional features of the published package. Installed in the image
# via `uv sync --group test` (see Dockerfile); excluded from a pure prod sync.
[dependency-groups]
test = [
    "pytest>=8.0,<9",
    "pytest-django>=4.8,<5",
    "pytest-xdist>=3.5,<4",
    "pytest-mock>=3.12,<4",
    "model-bakery>=1.17,<2",
]

[tool.uv]
# Security floors for transitive dependencies (GitHub Dependabot).
# pyasn1 pulled in via telethon -> rsa; pin to patched version.
constraint-dependencies = [
    "pyasn1>=0.6.4",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "app.config.settings"
python_files = ["test_*.py", "*_test.py", "tests.py"]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: tests that touch external services (MT5 mock, Redis, etc.)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
