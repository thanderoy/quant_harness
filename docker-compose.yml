x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"
    tag: "{{.Name}}"

x-common-labels: &default-labels
  logging: "promtail"
  logging_jobname: "containerlogs"
  stackname: "wmps"

  mt5:
    build:
      context: backend/mt5-api
      dockerfile: Dockerfile
    container_name: mt5
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - CUSTOM_USER=${CUSTOM_USER}
      - PASSWORD=${PASSWORD}
      - MT5_API_PORT=5001
      - MT5_API_HOST=0.0.0.0
      - WINEPREFIX=/config/.wine
      - WINEARCH=win64
    volumes:
      - /opt/mt5/config:/config
    networks:
      - traefik-public
      - default
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:5001/ >/dev/null 2>&1 || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15m
    labels:
      <<: *default-labels
      traefik.enable: true
      traefik.docker.network: traefik-public

      # Router for mt5.${domain} (Port 3000)
      traefik.http.routers.mt5-https.rule: Host(`${VNC_DOMAIN}`)
      traefik.http.routers.mt5-https.entrypoints: https
      traefik.http.routers.mt5-https.tls: true
      traefik.http.routers.mt5-https.tls.certresolver: le
      traefik.http.routers.mt5-https.service: mt5-service
      traefik.http.services.mt5-service.loadbalancer.server.port: 3000

      # Router for api.${domain} (Port 5001)
      traefik.http.routers.mt5-api-https.rule: Host(`${API_DOMAIN}`)
      traefik.http.routers.mt5-api-https.entrypoints: https
      traefik.http.routers.mt5-api-https.tls: true
      traefik.http.routers.mt5-api-https.tls.certresolver: le
      traefik.http.routers.mt5-api-https.service: mt5-api-service
      traefik.http.routers.mt5-api-https.middlewares: mt5-api-auth
      traefik.http.middlewares.mt5-api-auth.basicauth.users: ${MT5_API_USERNAME?Variable not set}:${MT5_API_HASHED_PASSWORD?Variable not set}
      traefik.http.services.mt5-api-service.loadbalancer.server.port: 5001
    logging: *default-logging

  mt5-test:
    build:
      context: backend/mt5-api
      dockerfile: Dockerfile
    container_name: mt5-test
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - CUSTOM_USER=${CUSTOM_USER}
      - PASSWORD=${PASSWORD}
      - MT5_API_PORT=5001
      - MT5_API_HOST=0.0.0.0
      - WINEPREFIX=/config/.wine
      - WINEARCH=win64
    volumes:
      - /opt/mt5-test/config:/config
    networks:
      - traefik-public
      - default
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:5001/ >/dev/null 2>&1 || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15m
    labels:
      <<: *default-labels
      traefik.enable: true
      traefik.docker.network: traefik-public

      # Router for VNC test (Port 3000)
      traefik.http.routers.mt5-test-https.rule: Host(`${VNC_TEST_DOMAIN}`)
      traefik.http.routers.mt5-test-https.entrypoints: https
      traefik.http.routers.mt5-test-https.tls: true
      traefik.http.routers.mt5-test-https.tls.certresolver: le
      traefik.http.routers.mt5-test-https.service: mt5-test-service
      traefik.http.services.mt5-test-service.loadbalancer.server.port: 3000

      # Router for API test (Port 5001)
      traefik.http.routers.mt5-test-api-https.rule: Host(`${API_TEST_DOMAIN}`)
      traefik.http.routers.mt5-test-api-https.entrypoints: https
      traefik.http.routers.mt5-test-api-https.tls: true
      traefik.http.routers.mt5-test-api-https.tls.certresolver: le
      traefik.http.routers.mt5-test-api-https.service: mt5-test-api-service
      traefik.http.routers.mt5-test-api-https.middlewares: mt5-test-api-auth
      traefik.http.middlewares.mt5-test-api-auth.basicauth.users: ${MT5_API_USERNAME?Variable not set}:${MT5_API_HASHED_PASSWORD?Variable not set}
      traefik.http.services.mt5-test-api-service.loadbalancer.server.port: 5001
    logging: *default-logging

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres-storage:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      <<: *default-labels
    logging: *default-logging

  trading:
    build:
      context: backend/trading
      dockerfile: Dockerfile
    container_name: trading
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - START_FOREXERO_ON_START=true
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - /opt/telegram/session:/app/session
    command: [ "gunicorn", "--bind", "0.0.0.0:8000", "--workers", "1", "--timeout", "120", "app.config.wsgi:application" ]
    depends_on:
      - postgres
      - redis
    networks:
      - default
      - traefik-public
    labels:
      <<: *default-labels
      traefik.enable: true
      traefik.docker.network: traefik-public

      # HTTPS Router
      traefik.http.routers.trading-https.rule: Host(`${DJANGO_SERVICE_DOMAIN}`)
      traefik.http.routers.trading-https.entrypoints: https
      traefik.http.routers.trading-https.tls: true
      traefik.http.routers.trading-https.tls.certresolver: le
      traefik.http.routers.trading-https.service: trading-service
      traefik.http.services.trading-service.loadbalancer.server.port: 8000

      # Static Files Router
      traefik.http.routers.trading-static.rule: Host(`${DJANGO_SERVICE_DOMAIN}`) && PathPrefix(`/static/`)
      traefik.http.routers.trading-static.entrypoints: https
      traefik.http.routers.trading-static.tls: true
      traefik.http.routers.trading-static.service: trading-service
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - default
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      <<: *default-labels
    logging: *default-logging
    cpus: 0.5
    mem_limit: 512m

  celery:
    build:
      context: backend/trading
      dockerfile: Dockerfile
    container_name: celery
    command: celery -A app worker --loglevel=info --concurrency=3
    volumes:
      - static_volume:/app/staticfiles
      - /opt/telegram/session:/app/session
    env_file:
      - .env
    depends_on:
      - trading
      - redis
    networks:
      - default
    labels:
      <<: *default-labels
    logging: *default-logging

  celery-beat:
    build:
      context: backend/trading
      dockerfile: Dockerfile
    container_name: celery-beat
    command: celery -A app beat --loglevel=info
    volumes:
      - static_volume:/app/staticfiles
      - /opt/telegram/session:/app/session
    env_file:
      - .env
    depends_on:
      - celery
      - redis
    networks:
      - default
    labels:
      <<: *default-labels
    logging: *default-logging

  grafana:
    image: grafana/grafana:12.3.0
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_USERS_DEFAULT_THEME=dark
      - GF_LOG_MODE=console
      - GF_LOG_LEVEL=warn
      - GF_PANELS_ENABLE_ALPHA=true
      - GF_FEATURE_TOGGLES_ENABLE=accessControlOnCall
      - GF_PLUGINS_PREINSTALL=grafana-polystat-panel
    volumes:
      - ./monitoring/configs/grafana/provisioning/dashboards.yml:/etc/grafana/provisioning/dashboards/provisioning-dashboards.yaml:ro
      - ./monitoring/configs/grafana/provisioning/datasources.yml:/etc/grafana/provisioning/datasources/provisioning-datasources.yaml:ro
      - ./monitoring/configs/grafana/plugins/app.yaml:/etc/grafana/provisioning/plugins/app.yaml:ro
      - ./monitoring/dashboards/node-metrics.json:/var/lib/grafana/dashboards/node-metrics.json:ro
      - ./monitoring/dashboards/container-metrics.json:/var/lib/grafana/dashboards/container-metrics.json:ro
      - ./monitoring/dashboards/log-search.json:/var/lib/grafana/dashboards/log-search.json:ro
      - ./monitoring/dashboards/traefik_official.json:/var/lib/grafana/dashboards/traefik_official.json:ro
      - ./monitoring/dashboards/alertmanager-dashboard.json:/var/lib/grafana/dashboards/alertmanager-dashboard.json:ro
      - grafana-storage:/var/lib/grafana
    depends_on:
      - prometheus
    cpus: 0.5
    mem_limit: 1024m
    networks:
      - default
      - traefik-public
    labels:
      <<: *default-labels
      traefik.enable: true
      traefik.docker.network: traefik-public
      traefik.http.routers.grafana.rule: Host(`${GRAFANA_SERVICE_DOMAIN?Variable not set}`)
      traefik.http.routers.grafana.entrypoints: https
      traefik.http.routers.grafana.tls: true
      traefik.http.routers.grafana.tls.certresolver: le
      traefik.http.services.grafana.loadbalancer.server.port: 3000
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--log.level=error"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"

    volumes:
      - ./monitoring/configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/configs/prometheus/recording-rules.yml:/etc/prometheus/recording-rules.yml
      - ./monitoring/configs/prometheus/alerting-rules.yml:/etc/prometheus/alerting-rules.yml
      - prometheus-storage:/prometheus
    depends_on:
      - alertmanager
    cpus: 0.5
    mem_limit: 512m
    networks:
      - default
      - traefik-public
    labels:
      <<: *default-labels
    logging: *default-logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.0
    container_name: cadvisor
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    cpus: 0.5
    mem_limit: 512m
    networks:
      - default
    labels:
      <<: *default-labels
    logging: *default-logging

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.ignored-mount-points"
      - "^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2|rootfs/run/docker/netns|rootfs/var/lib/docker/aufs)($$|/)"
    cpus: 0.5
    mem_limit: 512m
    networks:
      - default
    labels:
      <<: *default-labels
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: alertmanager
    command:
      - "--config.file=/etc/alertmanager/config.yml"
      - "--log.level=error"
      - "--storage.path=/alertmanager"
    volumes:
      - ./monitoring/configs/alertmanager/alertmanager-fallback-config.yml:/etc/alertmanager/config.yml

    cpus: 0.5
    mem_limit: 512m
    networks:
      - default
    depends_on:
      - uncomplicated-alert-receiver
    labels:
      <<: *default-labels
    logging: *default-logging

  uncomplicated-alert-receiver:
    image: ghcr.io/jamesread/uncomplicated-alert-receiver
    container_name: uncomplicated-alert-receiver
    cpus: 0.5
    mem_limit: 512m
    networks:
      - default
    labels:
      <<: *default-labels
    logging: *default-logging

  loki:
    image: grafana/loki:3.5.5
    container_name: loki

    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ./monitoring/configs/loki/loki.yaml:/etc/loki/loki.yaml
      - ./monitoring/configs/loki/rules.yaml:/etc/loki/rules/fake/loki-rules.yml
    cpus: 0.5
    mem_limit: 512m
    networks:
      - default
    labels:
      <<: *default-labels
    logging: *default-logging

  promtail:
    image: grafana/promtail:3.5.5

    container_name: promtail
    volumes:
      - promtail-positions:/tmp
      - ./monitoring/configs/promtail/promtail.yaml:/etc/promtail/docker-config.yaml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/docker-config.yaml
    depends_on:
      - loki
    cpus: 0.5
    mem_limit: 512m
    networks:
      - default
    labels:
      <<: *default-labels
    logging: *default-logging

  superset:
    image: apache/superset:6.0.0
    container_name: superset
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - SUPERSET_CONFIG_PATH=/app/superset_config.py
    volumes:
      - ./monitoring/superset/superset_config.py:/app/superset_config.py:ro
      - ./monitoring/superset/bootstrap.sh:/app/bootstrap.sh:ro
      - superset_home:/app/superset_home
    command: ["/bin/bash", "/app/bootstrap.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    cpus: 1
    mem_limit: 2048m
    networks:
      - default
      - traefik-public
    labels:
      <<: *default-labels
      traefik.enable: true
      traefik.docker.network: traefik-public
      traefik.http.routers.superset-https.rule: Host(`${SUPERSET_SERVICE_DOMAIN?Variable not set}`)
      traefik.http.routers.superset-https.entrypoints: https
      traefik.http.routers.superset-https.tls: true
      traefik.http.routers.superset-https.tls.certresolver: le
      traefik.http.routers.superset-https.service: superset-service
      traefik.http.services.superset-service.loadbalancer.server.port: 8088
    logging: *default-logging

volumes:
  grafana-storage: {}
  prometheus-storage: {}
  postgres-storage: {}
  static_volume: {}
  promtail-positions: {}
  media_volume: {}
  superset_home: {}

networks:
  default:
    driver: bridge
  traefik-public:
    external: true
